services:
  db:
    image: postgres:16-alpine
    container_name: mindora-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mindora
      POSTGRES_PASSWORD: mindora_dev_password
      POSTGRES_DB: mindora_dev
    ports:
      - '5433:5432'
    volumes:
      - mindora_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mindora']
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional: a lightweight DB GUI at http://localhost:5050
  # Comment out if you'd rather use a local Postgres client (TablePlus, DBeaver, etc).
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: mindora-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: kilwanda.josh@mindora.africa
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    depends_on:
      - db

volumes:
  mindora_pgdata:
